<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Albums · SnapShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/albums.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <h1 class="page-title">Albums</h1>
        <p class="page-sub">Group related photos and choose who can see each album.</p>
      </div>
      <button class="btn btn-navy" data-bs-toggle="modal" data-bs-target="#album-modal"><i class="bi bi-plus-lg"></i> New album</button>
    </div>

    <div id="grid" class="row g-4"></div>
    <div id="empty" class="empty d-none">
      <i class="bi bi-collection"></i>
      <div class="fw-medium">Create your first album</div>
      <div>Albums keep trips, events and projects together.</div>
    </div>
  </main>

  <div class="modal fade" id="album-modal" tabindex="-1" aria-labelledby="album-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="album-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="album-modal-title">New album</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="album-error" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3"><label class="form-label" for="a-name">Name</label><input class="form-control" id="a-name" maxlength="80"></div>
          <div class="mb-3"><label class="form-label" for="a-desc">Description <span class="text-secondary">(optional)</span></label><textarea class="form-control" id="a-desc" rows="2" maxlength="300"></textarea></div>
          <label class="form-label" for="a-vis">Visibility</label>
          <select class="form-select" id="a-vis">
            <option value="private">Private, only you</option>
            <option value="public">Public, anyone can view its public photos</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-navy">Create album</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album · SnapShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/album.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <div id="missing" class="empty d-none">
      <i class="bi bi-eye-slash"></i>
      <div class="fw-medium">This album isn't available</div>
      <div class="mb-3">It may be private or may have been deleted.</div>
      <a class="btn btn-navy" href="/explore.html">Back to Explore</a>
    </div>

    <div id="content" class="d-none">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <div id="badge" class="small text-secondary mb-1"></div>
          <h1 class="page-title" id="name"></h1>
          <p class="page-sub" id="meta"></p>
        </div>
        <div id="owner-tools" class="d-none d-flex flex-wrap gap-2">
          <a class="btn btn-navy btn-sm" id="add-photo"><i class="bi bi-upload"></i> Add post</a>
          <button class="btn btn-ghost btn-sm" id="toggle-vis"></button>
          <button class="btn btn-ghost btn-sm" id="delete" style="color: var(--danger)"><i class="bi bi-trash"></i> Delete album</button>
        </div>
      </div>
      <p id="description"></p>
      <div id="gallery" class="gallery"></div>
      <div id="empty" class="empty d-none">
        <i class="bi bi-image"></i>
        <div class="fw-medium">This album has no posts yet</div>
        <div>Add a post from the upload page, or move an existing post here by editing it.</div>
      </div>
    </div>
  </main>
</body>
</html>

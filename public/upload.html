<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload · SnapShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/upload.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <h1 class="page-title">Create a post</h1>
    <p class="page-sub mb-4">Add one photo or a set of photos that belong together</p>

    <form id="upload-form" class="row g-4" novalidate>
      <div class="col-lg-7">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose photos to upload">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          <div id="drop-hint">
            <span class="drop-icon"><i class="bi bi-cloud-arrow-up"></i></span>
            <div class="fw-medium mt-3" style="color: var(--ink)">Drag &amp; drop your photos here</div>
            <div class="my-2 small">or</div>
            <button type="button" class="btn btn-navy px-4" id="choose">Choose photos</button>
            <div class="small mt-3">Add up to 10 photos to one post. JPG, PNG, WebP, GIF (max 10 MB each)</div>
          </div>
          <div class="preview-grid d-none" id="previews"></div>
        </div>
        <div class="progress mt-3 d-none" id="progress-wrap" style="height: 8px">
          <div class="progress-bar" id="progress" style="width: 0; background: var(--primary)"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="panel">
          <h2 class="fs-6 fw-semibold mb-3">Post details</h2>
          <div id="error" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="title">Title</label>
            <input class="form-control" id="title" maxlength="100" placeholder="Enter a title for your photo" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="description">Description <span class="text-secondary">(optional)</span></label>
            <textarea class="form-control" id="description" rows="3" maxlength="500" placeholder="Tell us about this photo"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="tags">Tags <span class="text-secondary">(comma separated)</span></label>
            <input class="form-control" id="tags" placeholder="sunset, mountains, travel">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label small fw-medium" for="category">Category</label>
              <select class="form-select" id="category"></select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-medium" for="albumId">Album</label>
              <select class="form-select" id="albumId"><option value="">None</option></select>
            </div>
          </div>
          <fieldset class="mb-4">
            <legend class="form-label small fw-medium">Visibility</legend>
            <div class="row g-2">
              <div class="col-6">
                <label class="vis-option">
                  <input class="form-check-input mt-1" type="radio" name="visibility" value="public">
                  <span><span class="fw-medium">Public</span><span class="small">Visible to everyone</span></span>
                </label>
              </div>
              <div class="col-6">
                <label class="vis-option">
                  <input class="form-check-input mt-1" type="radio" name="visibility" value="private" checked>
                  <span><span class="fw-medium">Private</span><span class="small">Only you can view</span></span>
                </label>
              </div>
            </div>
          </fieldset>
          <button class="btn btn-navy w-100 py-2" type="submit" id="submit"><i class="bi bi-upload"></i> <span id="submit-label">Publish post</span></button>
        </div>
      </div>
    </form>
  </main>
</body>
</html>

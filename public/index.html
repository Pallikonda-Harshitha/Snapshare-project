<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapShare: capture, share, inspire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/home.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <section class="hero" id="hero">
      <div class="container">
        <h1>Capture. Share. <span class="glow">Inspire.</span></h1>
        <p>A place to share your moments with the world.</p>
        <div class="d-flex justify-content-center flex-wrap gap-3">
          <a class="btn btn-hero" href="/upload.html"><i class="bi bi-upload"></i> Upload Photos</a>
          <a class="btn btn-hero-outline" href="/explore.html"><i class="bi bi-compass"></i> Explore Gallery</a>
        </div>
        <div class="hero-stats d-none" id="hero-stats">
          <span class="hero-stat"><b id="st-photos">0</b>photos</span>
          <span class="hero-stat"><b id="st-creators">0</b>creators</span>
          <span class="hero-stat"><b id="st-likes">0</b>likes</span>
        </div>
      </div>
    </section>

    <div class="container py-4">
      <div class="chips justify-content-center my-3" id="categories"></div>

      <div class="section-head mt-4">
        <h2>Featured Photos</h2>
        <a href="/explore.html?sort=liked">View all <i class="bi bi-arrow-right"></i></a>
      </div>
      <div id="featured" class="gallery"></div>
      <div id="empty" class="empty d-none">
        <i class="bi bi-images"></i>
        <div class="fw-medium">No public photos yet</div>
        <div class="mb-3">Be the first to share one.</div>
        <a class="btn btn-navy" href="/upload.html">Upload a photo</a>
      </div>

      <div id="trending-wrap" class="mt-5 d-none">
        <div class="section-head"><h2>Trending Tags</h2></div>
        <div class="chips" id="trending"></div>
      </div>
    </div>
  </main>
  <footer><div class="container">SnapShare, a full-stack photo gallery project.</div></footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · SnapShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="container py-5" style="max-width: 440px">
    <h1 class="page-title mb-1">Create your account</h1>
    <p class="page-sub mb-4">Start organizing and sharing your photos.</p>
    <form id="auth-form" class="panel" data-mode="register" novalidate>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" type="text" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" autocomplete="new-password" minlength="8" required>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <button class="btn btn-navy w-100" type="submit">Sign up</button>
    </form>
    <p class="text-center mt-3 text-secondary">Already have an account? <a href="/login.html">Log in</a></p>
  </main>
</body>
</html>

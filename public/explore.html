<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore · SnapShare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/explore.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <h1 class="page-title">Explore</h1>
        <p class="page-sub" id="summary">Public photos from the community</p>
      </div>
      <select id="sort" class="form-select w-auto" aria-label="Sort photos">
        <option value="newest">Newest first</option>
        <option value="liked">Most liked</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <form id="search-form" class="d-flex gap-2 mb-3" role="search">
      <input id="q" class="form-control" type="search" placeholder="Search by title, caption or tag" aria-label="Search photos">
      <button class="btn btn-navy px-4" type="submit">Search</button>
    </form>
    <div class="chips mb-4" id="categories"></div>

    <div id="gallery" class="gallery"></div>
    <div id="empty" class="empty d-none">
      <i class="bi bi-search"></i>
      <div class="fw-medium">No photos match</div>
      <div>Try a different search or category.</div>
    </div>
    <div class="text-center mt-4"><button id="more" class="btn btn-outline-navy d-none px-4">Load more</button></div>
  </main>
  <footer><div class="container">SnapShare, a full-stack photo gallery project.</div></footer>
</body>
</html>
